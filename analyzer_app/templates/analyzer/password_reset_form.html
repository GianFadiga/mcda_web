{% extends 'analyzer/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Recuperar Senha</h3>
                    <p class="text-muted text-center">
                        Digite seu e-mail e enviaremos uma nova senha temporária para você.
                    </p>

                    <form method="POST" action="{% url 'password_reset_request' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="email" class="form-label">Seu E-mail:</label>
                            <input type="email" class="form-control" name="email" id="email" placeholder="seu-email@exemplo.com" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="text-decoration-none">Voltar para o Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
